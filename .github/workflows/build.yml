name: Build TrollStore IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build app bundle (Objective-C)
        run: |
          set -e
          APP=build/Payload/SandboxScanner.app
          mkdir -p "$APP"

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)

          xcrun --sdk iphoneos clang \
            -target arm64-apple-ios14.0 \
            -isysroot "$SDK_PATH" \
            -O2 \
            -fobjc-arc \
            -framework UIKit \
            -framework Foundation \
            -framework Security \
            -lsqlite3 \
            -o "$APP/SandboxScanner" \
            Sources/main.m Sources/AppDelegate.m Sources/ViewController.m

          cp Info.plist "$APP/Info.plist"
          chmod +x "$APP/SandboxScanner"

      - name: Sign with entitlements
        run: |
          set -e
          APP=build/Payload/SandboxScanner.app
          codesign --force --sign - --entitlements SandboxScanner.entitlements --timestamp=none "$APP/SandboxScanner"
          echo "=== signed entitlements ==="
          codesign -d --entitlements :- "$APP/SandboxScanner" || true

      - name: Package IPA
        run: |
          set -e
          cd build
          mkdir -p Payload
          zip -qry ../SandboxScanner.ipa Payload
          cd ..
          ls -la SandboxScanner.ipa
          shasum -a 256 SandboxScanner.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SandboxScanner-ipa
          path: SandboxScanner.ipa
          retention-days: 30
