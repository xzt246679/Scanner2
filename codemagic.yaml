workflows:
  ios-trollstore-ipa:
    name: Build SandboxScanner IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Show toolchain
        script: |
          set -e
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Compile Swift sources
        script: |
          set -e
          APP=build/Payload/SandboxScanner.app
          rm -rf build SandboxScanner.ipa
          mkdir -p "$APP"

          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios14.0 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -O \
            -module-name SandboxScanner \
            -emit-executable \
            -o "$APP/SandboxScanner" \
            Sources/main.swift Sources/AppDelegate.swift Sources/ViewController.swift

          cp Info.plist "$APP/Info.plist"
          chmod +x "$APP/SandboxScanner"
          echo "=== compiled ==="
          ls -la "$APP"
          file "$APP/SandboxScanner"

      - name: Sign with ldid
        script: |
          set +e
          APP=build/Payload/SandboxScanner.app
          BIN="$APP/SandboxScanner"

          echo "=== entitlements file ==="
          cat SandboxScanner.entitlements

          # 尝试多种方式
          FOUND=""
          for C in /opt/homebrew/bin/ldid /usr/local/bin/ldid "$(which ldid 2>/dev/null)"; do
            if [ -n "$C" ] && [ -x "$C" ]; then
              echo "candidate: $C"
              "$C" -S SandboxScanner.entitlements "$BIN" 2>&1
              if [ $? -eq 0 ]; then FOUND="$C"; break; fi
            fi
          done

          if [ -z "$FOUND" ]; then
            echo "=== ldid 全部失败，尝试简化 entitlements ==="
            cat > /tmp/simple.entitlements <<'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
  <key>application-identifier</key>
  <string>com.coldcoffee.sandboxscanner</string>
  <key>com.apple.developer.team-identifier</key>
  <string>COLDFCOFFEE</string>
  <key>get-task-allow</key>
  <true/>
  <key>platform-application</key>
  <true/>
  <key>com.apple.private.security.no-sandbox</key>
  <true/>
</dict>
</plist>
EOF
            LD="/opt/homebrew/bin/ldid"
            [ -x "$LD" ] || LD="/usr/local/bin/ldid"
            echo "retry with: $LD"
            "$LD" -S/tmp/simple.entitlements "$BIN" 2>&1 || true
          fi

          echo "=== verify ==="
          LD="/opt/homebrew/bin/ldid"
          [ -x "$LD" ] || LD="/usr/local/bin/ldid"
          "$LD" -e "$BIN" 2>&1 | head -30 || true
          echo "DONE"

      - name: Package IPA
        script: |
          set -e
          cd build
          zip -qry ../SandboxScanner.ipa Payload
          cd ..
          ls -la SandboxScanner.ipa
          shasum -a 256 SandboxScanner.ipa
          echo "IPA READY"

    artifacts:
      - SandboxScanner.ipa
