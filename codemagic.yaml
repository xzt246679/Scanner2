workflows:
  ios-trollstore-ipa:
    name: Build SandboxScanner IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Show toolchain
        script: |
          set -e
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Compile Swift sources
        script: |
          set -e
          APP=build/Payload/SandboxScanner.app
          rm -rf build SandboxScanner.ipa
          mkdir -p "$APP"

          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios14.0 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -O \
            -module-name SandboxScanner \
            -emit-executable \
            -o "$APP/SandboxScanner" \
            Sources/main.swift Sources/AppDelegate.swift Sources/ViewController.swift

          cp Info.plist "$APP/Info.plist"
          chmod +x "$APP/SandboxScanner"
          echo "BUILD OK"
          ls -la "$APP"

      - name: Install ldid
        script: |
          set +e
          brew install ldid
          echo "--- which ldid ---"
          which ldid || true
          ls -la /opt/homebrew/bin/ldid 2>/dev/null || true
          ls -la /usr/local/bin/ldid 2>/dev/null || true
          echo "LDID PATH: $(which ldid || echo /opt/homebrew/bin/ldid)"

      - name: Sign with entitlements
        script: |
          set -e
          APP=build/Payload/SandboxScanner.app
          LDID="$(which ldid || echo /opt/homebrew/bin/ldid)"
          echo "using: $LDID"
          "$LDID" -S SandboxScanner.entitlements "$APP/SandboxScanner"
          echo "=== entitlements readback ==="
          "$LDID" -e "$APP/SandboxScanner" || true

      - name: Package IPA
        script: |
          set -e
          cd build
          zip -qry ../SandboxScanner.ipa Payload
          cd ..
          ls -la SandboxScanner.ipa
          shasum -a 256 SandboxScanner.ipa
          echo "IPA READY"

    artifacts:
      - SandboxScanner.ipa
