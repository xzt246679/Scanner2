workflows:
  ios-trollstore-ipa:
    name: Build SandboxScanner IPA (ObjC)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Show toolchain
        script: |
          set -e
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          echo "SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)"

      - name: Compile Objective-C sources
        script: |
          set -e
          APP=build/Payload/SandboxScanner.app
          rm -rf build SandboxScanner.ipa
          mkdir -p "$APP"

          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          clang -arch arm64 \
            -isysroot "$SDK" \
            -mios-version-min=14.0 \
            -fobjc-arc \
            -O2 \
            -framework UIKit \
            -framework Foundation \
            -framework Security \
            -o "$APP/SandboxScanner" \
            Sources/main.m \
            Sources/AppDelegate.m \
            Sources/ViewController.m

          cp Info.plist "$APP/Info.plist"
          chmod +x "$APP/SandboxScanner"
          echo "=== binary info ==="
          ls -la "$APP"
          file "$APP/SandboxScanner"

      - name: Verify no Swift dependency
        script: |
          set -e
          BIN=build/Payload/SandboxScanner.app/SandboxScanner
          echo "=== 依赖检查 ==="
          otool -L "$BIN"
          echo
          if otool -L "$BIN" | grep -i swift; then
            echo "!!! 仍然依赖 Swift 运行时"
            exit 1
          fi
          echo "✅ 无 Swift 依赖"
          echo
          echo "=== 最低版本 / SDK ==="
          vtool -show-build "$BIN"

      - name: Write full entitlements
        script: |
          set -e
          cat > final.entitlements <<'ENTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>application-identifier</key>
            <string>com.coldcoffee.sandboxscanner</string>
            <key>com.apple.developer.team-identifier</key>
            <string>COLDFCOFFEE</string>
            <key>get-task-allow</key>
            <true/>
            <key>platform-application</key>
            <true/>
            <key>com.apple.private.security.no-sandbox</key>
            <true/>
            <key>com.apple.private.security.container-required</key>
            <false/>
            <key>com.apple.private.security.storage.AppDataContainers</key>
            <true/>
            <key>com.apple.private.skip-library-validation</key>
            <true/>
            <key>keychain-access-groups</key>
            <array>
              <string>com.coldcoffee.sandboxscanner</string>
              <string>*</string>
            </array>
            <key>com.apple.security.exception.files.absolute-path.read-only</key>
            <array>
              <string>/</string>
              <string>/var/</string>
              <string>/private/</string>
            </array>
            <key>com.apple.security.exception.files.absolute-path.read-write</key>
            <array>
              <string>/var/mobile/</string>
              <string>/private/var/mobile/</string>
            </array>
          </dict>
          </plist>
          ENTEOF
          plutil -lint final.entitlements

      - name: Sign
        script: |
          set +e
          APP=build/Payload/SandboxScanner.app
          BIN="$APP/SandboxScanner"
          codesign --force --sign - --entitlements final.entitlements --timestamp=none "$BIN"
          echo "rc=$?"
          codesign -d --entitlements :- "$BIN" 2>&1 | head -50

      - name: Verify entitlements
        script: |
          set +e
          BIN=build/Payload/SandboxScanner.app/SandboxScanner
          OUT=$(codesign -d --entitlements :- "$BIN" 2>/dev/null)
          echo "$OUT" | grep -q "no-sandbox" && echo "PASS_no_sandbox" || echo "FAIL_no_sandbox"
          echo "$OUT" | grep -q "platform-application" && echo "PASS_platform" || echo "FAIL_platform"
          echo "$OUT" | grep -q "AppDataContainers" && echo "PASS_appdata" || echo "FAIL_appdata"
          echo "$OUT" | grep -q "keychain-access-groups" && echo "PASS_keychain" || echo "FAIL_keychain"

      - name: Package IPA
        script: |
          set -e
          cd build
          zip -qry ../SandboxScanner.ipa Payload
          cd ..
          ls -la SandboxScanner.ipa
          shasum -a 256 SandboxScanner.ipa
          echo "IPA READY"

    artifacts:
      - SandboxScanner.ipa

