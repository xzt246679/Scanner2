workflows:
  ios-trollstore-ipa:
    name: Build SandboxScanner IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Show toolchain
        script: |
          set -e
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Compile Objective-C
        script: |
          set -e
          APP=build/Payload/SandboxScanner.app
          rm -rf build SandboxScanner.ipa
          mkdir -p "$APP"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          clang -arch arm64 -isysroot "$SDK" -mios-version-min=14.0 \
            -fobjc-arc -O2 \
            -framework UIKit -framework Foundation -framework Security \
            -o "$APP/SandboxScanner" \
            Sources/main.m Sources/AppDelegate.m Sources/ViewController.m

          cp Info.plist "$APP/Info.plist"
          chmod +x "$APP/SandboxScanner"
          ls -la "$APP"

      - name: Write entitlements (v1 level: 6 keys only)
        script: |
          set -e
          cat > final.entitlements <<'ENTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>application-identifier</key>
            <string>com.coldcoffee.sandboxscanner</string>
            <key>com.apple.developer.team-identifier</key>
            <string>COLDFCOFFEE</string>
            <key>get-task-allow</key>
            <true/>
            <key>platform-application</key>
            <true/>
            <key>com.apple.private.security.no-sandbox</key>
            <true/>
            <key>com.apple.private.security.container-required</key>
            <false/>
          </dict>
          </plist>
          ENTEOF
          plutil -lint final.entitlements
          cat final.entitlements

      - name: Sign with codesign (ad-hoc, same as v1)
        script: |
          set +e
          BIN=build/Payload/SandboxScanner.app/SandboxScanner
          codesign --force --sign - --entitlements final.entitlements --timestamp=none "$BIN"
          echo "rc=$?"
          echo "=== dump ==="
          codesign -d --entitlements :- "$BIN" 2>&1 | head -30

      - name: Verify
        script: |
          set +e
          BIN=build/Payload/SandboxScanner.app/SandboxScanner
          otool -L "$BIN" | grep -i swift && echo "!! Swift" || echo "no swift OK"
          echo
          python3 - "$BIN" <<'PYEOF'
          import sys, struct
          d = open(sys.argv[1], 'rb').read()
          ncmds = struct.unpack('<I', d[16:20])[0]
          q = 32
          sigoff = sigsize = 0
          for _ in range(ncmds):
              cmd, sz = struct.unpack('<II', d[q:q+8])
              if cmd == 0x1D:
                  sigoff, sigsize = struct.unpack('<II', d[q+8:q+16])
              if sz == 0: break
              q += sz
          blob = d[sigoff:sigoff+sigsize]
          magic, length, count = struct.unpack('>III', blob[0:12])
          idx = 12
          slots = {}
          for _ in range(count):
              sto, sst = struct.unpack('>II', blob[idx:idx+8])
              idx += 8
              slots[sto] = sst
          print("SuperBlob count=%d slots=%s" % (count, sorted(hex(k) for k in slots)))
          o = slots[0]
          cdm, cdl, cdver, cdflags = struct.unpack('>IIII', blob[o:o+16])
          print("CodeDirectory flags=0x%x (0x2=ADHOC, 0x100=LINKER_SIGNED)" % cdflags)
          names = {0:'CodeDirectory',2:'Requirements',5:'Entitlements',6:'DER-Ents',
                   7:'AltCD',0x1000:'Signature'}
          for k in sorted(slots):
              print("  slot 0x%08X %s" % (k, names.get(k,'?')))
          PYEOF

      - name: Package IPA
        script: |
          set -e
          cd build
          zip -qry ../SandboxScanner.ipa Payload
          cd ..
          ls -la SandboxScanner.ipa
          shasum -a 256 SandboxScanner.ipa

    artifacts:
      - SandboxScanner.ipa
