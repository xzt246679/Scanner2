workflows:
  ios-trollstore-ipa:
    name: Build SandboxScanner IPA (ObjC + ldid)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Show toolchain
        script: |
          set -e
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install ldid
        script: |
          set -e
          brew install ldid
          which ldid
          ldid -h 2>&1 | head -20 || true

      - name: Compile Objective-C sources
        script: |
          set -e
          APP=build/Payload/SandboxScanner.app
          rm -rf build SandboxScanner.ipa
          mkdir -p "$APP"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          clang -arch arm64 \
            -isysroot "$SDK" \
            -mios-version-min=14.0 \
            -fobjc-arc -O2 \
            -framework UIKit -framework Foundation -framework Security \
            -o "$APP/SandboxScanner" \
            Sources/main.m Sources/AppDelegate.m Sources/ViewController.m

          cp Info.plist "$APP/Info.plist"
          chmod +x "$APP/SandboxScanner"
          ls -la "$APP"

      - name: Write entitlements
        script: |
          set -e
          cat > final.entitlements <<'ENTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>application-identifier</key>
            <string>com.coldcoffee.sandboxscanner</string>
            <key>com.apple.developer.team-identifier</key>
            <string>COLDFCOFFEE</string>
            <key>get-task-allow</key>
            <true/>
            <key>platform-application</key>
            <true/>
            <key>com.apple.private.security.no-sandbox</key>
            <true/>
            <key>com.apple.private.security.container-required</key>
            <false/>
            <key>com.apple.private.security.storage.AppDataContainers</key>
            <true/>
            <key>com.apple.private.skip-library-validation</key>
            <true/>
            <key>keychain-access-groups</key>
            <array>
              <string>com.coldcoffee.sandboxscanner</string>
              <string>*</string>
            </array>
          </dict>
          </plist>
          ENTEOF
          plutil -lint final.entitlements

      - name: Sign with ldid -M (generates DER entitlements)
        script: |
          set +e
          BIN=build/Payload/SandboxScanner.app/SandboxScanner
          LDID=$(which ldid)

          echo "=== ldid version ==="
          $LDID -h 2>&1 | head -3 || true

          echo "=== sign: -M -S (M = generate DER entitlements, TrollStore mode) ==="
          $LDID -M -Sfinal.entitlements "$BIN"
          echo "ldid rc=$?"

          echo "=== readback xml ==="
          $LDID -e "$BIN" 2>&1 | head -40

          echo "=== check DER slot ==="
          python3 - "$BIN" <<'PYEOF'
          import sys, struct
          p = sys.argv[1]
          d = open(p, 'rb').read()
          ncmds = struct.unpack('<I', d[16:20])[0]
          q = 32
          sigoff = sigsize = 0
          for _ in range(ncmds):
              cmd, sz = struct.unpack('<II', d[q:q+8])
              if cmd == 0x1D:
                  sigoff, sigsize = struct.unpack('<II', d[q+8:q+16])
              if sz == 0: break
              q += sz
          blob = d[sigoff:sigoff+sigsize]
          magic, length, count = struct.unpack('>III', blob[0:12])
          idx = 12
          slots = {}
          for _ in range(count):
              sto, sst = struct.unpack('>II', blob[idx:idx+8])
              idx += 8
              slots[sto] = sst
          print("SuperBlob magic=0x%08X count=%d" % (magic, count))
          names = {0:'CodeDirectory',2:'Requirements',5:'Entitlements',6:'DER-Entitlements',
                   7:'AltCodeDirectory',0x1000:'Signature',0x10000:'AltCD2'}
          for k, v in sorted(slots.items()):
              print("  slot 0x%08X %-20s off=%d" % (k, names.get(k,'?'), v))
          print()
          if 6 in slots:
              print("✅ 存在 DER entitlements (slot 6)")
          else:
              print("❌ 仍然没有 DER entitlements")
          PYEOF

      - name: Verify
        script: |
          set +e
          BIN=build/Payload/SandboxScanner.app/SandboxScanner
          echo "=== swift deps ==="
          otool -L "$BIN" | grep -i swift && echo "有 Swift 依赖" || echo "无 Swift 依赖 ✅"
          echo
          echo "=== codesign dump ==="
          codesign -d --entitlements :- "$BIN" 2>&1 | head -40

      - name: Package IPA
        script: |
          set -e
          cd build
          zip -qry ../SandboxScanner.ipa Payload
          cd ..
          ls -la SandboxScanner.ipa
          shasum -a 256 SandboxScanner.ipa
          echo "IPA READY"

    artifacts:
      - SandboxScanner.ipa
