workflows:
  ios-trollstore-ipa:
    name: Build SandboxScanner IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Show toolchain
        script: |
          set -e
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          echo "=== ldid 来源 ==="
          brew --prefix 2>/dev/null || true
          ls -la /opt/homebrew/bin/ldid 2>/dev/null || echo "homebrew ldid 不存在"

      - name: Install ldid from source
        script: |
          set -e
          echo "=== 用 git clone 编译 ldid（避开 brew 版本 bug）==="
          cd "$CM_BUILD_DIR"
          rm -rf ldid-src
          git clone --depth 1 https://github.com/ProcursusTeam/ldid.git ldid-src
          cd ldid-src
          git submodule update --init --recursive 2>/dev/null || true
          make -j4
          ls -la ./ldid
          cp ./ldid "$CM_BUILD_DIR/ldid-custom"
          chmod +x "$CM_BUILD_DIR/ldid-custom"
          echo "=== 自定义 ldid 版本 ==="
          "$CM_BUILD_DIR/ldid-custom" -h 2>&1 | head -5 || true

      - name: Compile Swift sources
        script: |
          set -e
          APP=build/Payload/SandboxScanner.app
          rm -rf build SandboxScanner.ipa
          mkdir -p "$APP"

          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios14.0 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -O \
            -module-name SandboxScanner \
            -emit-executable \
            -o "$APP/SandboxScanner" \
            Sources/main.swift Sources/AppDelegate.swift Sources/ViewController.swift

          cp Info.plist "$APP/Info.plist"
          chmod +x "$APP/SandboxScanner"
          echo "=== compiled ==="
          ls -la "$APP"

      - name: Prepare entitlements
        script: |
          set -e
          python3 - <<'PYEOF'
          import plistlib

          ent = {
              "application-identifier": "com.coldcoffee.sandboxscanner",
              "com.apple.developer.team-identifier": "COLDFCOFFEE",
              "get-task-allow": True,
              "platform-application": True,
              "com.apple.private.security.no-sandbox": True,
              "com.apple.private.security.container-required": False,
              "com.apple.private.security.storage.AppDataContainers": True,
              "com.apple.private.skip-library-validation": True,
              "keychain-access-groups": ["com.coldcoffee.sandboxscanner"],
          }
          with open("final.entitlements", "wb") as f:
              plistlib.dump(ent, f, fmt=plistlib.FMT_XML)
          print("written final.entitlements")
          PYEOF
          cat final.entitlements

      - name: Sign with custom ldid
        script: |
          set +e
          APP=build/Payload/SandboxScanner.app
          BIN="$APP/SandboxScanner"
          LDID="$CM_BUILD_DIR/ldid-custom"

          echo "=== signing with: $LDID ==="
          "$LDID" -Sfinal.entitlements "$BIN"
          RC=$?
          echo "exit code: $RC"

          if [ $RC -ne 0 ]; then
            echo "!!! 签名失败，尝试 brew ldid !!!"
            if [ -x /opt/homebrew/bin/ldid ]; then
              /opt/homebrew/bin/ldid -Sfinal.entitlements "$BIN"
              echo "brew ldid exit: $?"
            fi
          fi

          echo "=== 读回 entitlements（关键验证）==="
          "$LDID" -e "$BIN" 2>&1 | head -60

          echo "=== codesign 信息 ==="
          codesign -dv --entitlements :- "$BIN" 2>&1 | head -40

      - name: Verify entitlements contains no-sandbox
        script: |
          set -e
          APP=build/Payload/SandboxScanner.app
          BIN="$APP/SandboxScanner"
          LDID="$CM_BUILD_DIR/ldid-custom"

          OUT=$("$LDID" -e "$BIN" 2>&1 || true)
          echo "$OUT"

          if echo "$OUT" | grep -q "no-sandbox"; then
            echo "✅ entitlements 包含 no-sandbox"
          else
            echo "❌ entitlements 缺少 no-sandbox —— 装机后不会有权限"
            echo "继续打包，但需要换方案"
          fi

          if echo "$OUT" | grep -q "platform-application"; then
            echo "✅ entitlements 包含 platform-application"
          else
            echo "❌ entitlements 缺少 platform-application"
          fi

      - name: Package IPA
        script: |
          set -e
          cd build
          zip -qry ../SandboxScanner.ipa Payload
          cd ..
          ls -la SandboxScanner.ipa
          shasum -a 256 SandboxScanner.ipa
          echo "IPA READY"

    artifacts:
      - SandboxScanner.ipa
