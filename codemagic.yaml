workflows:
  ios-trollstore-ipa:
    name: Build SandboxScanner IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Show toolchain
        script: |
          set -e
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          echo "--- ldid ---"
          ls -la /opt/homebrew/bin/ldid 2>/dev/null || echo "none"
          which codesign

      - name: Compile Swift sources
        script: |
          set -e
          APP=build/Payload/SandboxScanner.app
          rm -rf build SandboxScanner.ipa
          mkdir -p "$APP"

          xcrun --sdk iphoneos swiftc \
            -target arm64-apple-ios14.0 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -O \
            -module-name SandboxScanner \
            -emit-executable \
            -o "$APP/SandboxScanner" \
            Sources/main.swift Sources/AppDelegate.swift Sources/ViewController.swift

          cp Info.plist "$APP/Info.plist"
          chmod +x "$APP/SandboxScanner"
          echo "=== compiled ==="
          ls -la "$APP"
          file "$APP/SandboxScanner"

      - name: Write minimal entitlements
        script: |
          set -e
          cat > final.entitlements <<'ENTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>application-identifier</key>
            <string>com.coldcoffee.sandboxscanner</string>
            <key>com.apple.developer.team-identifier</key>
            <string>COLDFCOFFEE</string>
            <key>get-task-allow</key>
            <true/>
            <key>platform-application</key>
            <true/>
            <key>com.apple.private.security.no-sandbox</key>
            <true/>
            <key>com.apple.private.security.container-required</key>
            <false/>
          </dict>
          </plist>
          ENTEOF
          echo "=== final.entitlements ==="
          cat final.entitlements
          echo "=== plist 语法校验 ==="
          plutil -lint final.entitlements

      - name: Sign with codesign (ad-hoc + entitlements)
        script: |
          set +e
          APP=build/Payload/SandboxScanner.app
          BIN="$APP/SandboxScanner"

          echo "=== codesign ad-hoc with entitlements ==="
          codesign --force --sign - --entitlements final.entitlements --timestamp=none "$BIN" 2>&1
          echo "codesign rc=$?"

          echo "=== codesign verify ==="
          codesign -dv --entitlements :- "$BIN" 2>&1 | head -40

      - name: Sign with ldid (fallback)
        script: |
          set +e
          APP=build/Payload/SandboxScanner.app
          BIN="$APP/SandboxScanner"

          LDID=""
          for C in /opt/homebrew/bin/ldid /usr/local/bin/ldid; do
            if [ -x "$C" ]; then LDID="$C"; break; fi
          done

          if [ -z "$LDID" ]; then
            echo "no ldid, skip"
            exit 0
          fi

          echo "=== ldid: $LDID ==="
          echo "--- readback before ---"
          "$LDID" -e "$BIN" 2>&1 | head -20

          echo "--- try ldid -S ---"
          "$LDID" -Sfinal.entitlements "$BIN" 2>&1
          echo "rc=$?"

          echo "--- readback after ---"
          "$LDID" -e "$BIN" 2>&1 | head -30

      - name: Verify entitlements present
        script: |
          set +e
          APP=build/Payload/SandboxScanner.app
          BIN="$APP/SandboxScanner"

          echo "=== 最终检查 ==="
          OUT=$(codesign -d --entitlements :- "$BIN" 2>/dev/null)
          echo "$OUT" | head -40
          echo "---- 关键字 ----"
          echo "$OUT" | grep -q "no-sandbox" && echo "PASS_no_sandbox" || echo "FAIL_no_sandbox"
          echo "$OUT" | grep -q "platform-application" && echo "PASS_platform" || echo "FAIL_platform"

      - name: Package IPA
        script: |
          set -e
          cd build
          zip -qry ../SandboxScanner.ipa Payload
          cd ..
          ls -la SandboxScanner.ipa
          shasum -a 256 SandboxScanner.ipa
          echo "IPA READY"

    artifacts:
      - SandboxScanner.ipa
