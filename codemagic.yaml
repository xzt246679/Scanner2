workflows:
  ios-trollstore-ipa:
    name: Build SandboxScanner IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Compile Objective-C
        script: |
          set +e
          APP=build/Payload/SandboxScanner.app
          rm -rf build SandboxScanner.ipa
          mkdir -p "$APP"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"

          clang -arch arm64 -isysroot "$SDK" -mios-version-min=14.0 \
            -fobjc-arc -O2 -Wall \
            -framework UIKit -framework Foundation -framework Security \
            -o "$APP/SandboxScanner" \
            Sources/main.m Sources/AppDelegate.m Sources/ViewController.m \
            2>&1 | tee compile.log

          RC=${PIPESTATUS[0]}
          echo "=== clang exit code: $RC ==="
          cp compile.log "$CM_BUILD_DIR/compile.log" 2>/dev/null || true

          if [ "$RC" -ne 0 ]; then
            echo "================= 编译失败 ================="
            grep -E "error:" compile.log | head -40
            echo "=========================================="
            exit 1
          fi

          cp Info.plist "$APP/Info.plist"
          chmod +x "$APP/SandboxScanner"
          echo "编译成功"

      - name: Generate entitlements
        script: |
          set -e
          python3 - <<'PYEOF'
          import plistlib
          ent = {
              "application-identifier": "com.coldcoffee.sandboxscanner",
              "com.apple.developer.team-identifier": "COLDFCOFFEE",
              "get-task-allow": True,
              "platform-application": True,
              "com.apple.private.security.no-sandbox": True,
              "com.apple.private.security.container-required": False,
              "com.apple.private.security.storage.AppDataContainers": True,
          }
          with open("final.entitlements", "wb") as f:
              plistlib.dump(ent, f, fmt=plistlib.FMT_XML)
          print("keys:", len(ent))
          PYEOF

      - name: Sign
        script: |
          set +e
          BIN=build/Payload/SandboxScanner.app/SandboxScanner
          codesign --force --sign - --entitlements final.entitlements --timestamp=none "$BIN"
          echo "rc=$?"

      - name: Package IPA
        script: |
          set -e
          cd build
          zip -qry ../SandboxScanner.ipa Payload
          cd ..
          ls -la SandboxScanner.ipa

    artifacts:
      - SandboxScanner.ipa
      - compile.log
